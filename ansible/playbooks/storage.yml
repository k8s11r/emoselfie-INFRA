---
# 기본 StorageClass를 Longhorn 하나로 정리한다.
#
# k3s는 local-path를 기본값으로 설치하고, Longhorn 매니페스트도 자기
# StorageClass를 기본값으로 만든다. 기본값이 둘이면 쿠버네티스는 가장 최근에
# 만든 쪽을 고르므로 storageClassName이 없는 PVC(postgres)가 어느 쪽에 붙을지가
# 설치 순서에 달린다.
#
# local-path는 지우지 않는다. redis와 redis-sentinel이 storageClassName으로
# 명시해 쓰고 있다. 기본값 표시만 뗀다.
#
# 단독 실행도 된다. Vault를 읽지 않으므로 --ask-vault-pass가 필요 없다.
#
#   ansible-playbook playbooks/storage.yml

- name: Build a server-node inventory from Terraform outputs
  hosts: localhost
  gather_facts: false

  vars:
    repo_root: "{{ playbook_dir }}/../.."
    terraform_dir: "{{ repo_root }}/terraform"
    ssh_private_key_file: "{{ repo_root }}/../project1_key.pem"

  tasks:
    - name: Check the administrator SSH private key
      ansible.builtin.stat:
        path: "{{ ssh_private_key_file }}"
      register: administrator_ssh_key

    - name: Validate the administrator SSH private key
      ansible.builtin.assert:
        that:
          - administrator_ssh_key.stat.exists
          - administrator_ssh_key.stat.isreg
        fail_msg: >-
          Terraform 인스턴스에 접속할 project1_key.pem을 찾을 수 없습니다:
          {{ ssh_private_key_file }}

    - name: Read all node public IPs from Terraform
      ansible.builtin.command:
        argv:
          - terraform
          - "-chdir={{ terraform_dir }}"
          - output
          - -json
          - node_public_ips
      register: terraform_node_ips
      changed_when: false
      check_mode: false

    # k3s의 packaged manifest를 읽는 addon 컨트롤러는 server 노드에만 있다.
    - name: Add the k3s server nodes to the in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.key }}"
        groups: k3s_servers
        ansible_host: "{{ item.value }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ ssh_private_key_file }}"
        ansible_python_interpreter: /usr/bin/python3
      loop: >-
        {{ (terraform_node_ips.stdout | from_json) | dict2items
           | selectattr('key', 'match', '^server') | list }}
      loop_control:
        label: "{{ item.key }}"

    - name: Validate that Terraform reported at least one server node
      ansible.builtin.assert:
        that: (groups['k3s_servers'] | default([])) | length > 0
        fail_msg: >-
          Terraform output의 node_public_ips에 server로 시작하는 노드가 없습니다.
          terraform apply가 끝났는지 확인하십시오.

- name: Stop local-path from claiming the default StorageClass
  hosts: k3s_servers
  gather_facts: false
  become: true

  vars:
    local_storage_skip_file: /var/lib/rancher/k3s/server/manifests/local-storage.yaml.skip
    default_class_annotation: storageclass.kubernetes.io/is-default-class

  pre_tasks:
    - name: Wait until the server node accepts SSH connections
      ansible.builtin.wait_for_connection:
        timeout: 300

  tasks:
    # 새로 만든 클러스터에서는 k3s가 아직 local-storage를 적용하기 전일 수 있다.
    # 그 전에 .skip을 놓으면 local-path가 아예 만들어지지 않아, 그것을 명시해 쓰는
    # redis PVC가 Pending에 갇힌다. StorageClass가 생긴 뒤에만 막는다.
    - name: Wait until k3s has created the local-path StorageClass
      ansible.builtin.command:
        argv: [k3s, kubectl, get, storageclass, local-path, -o, name]
      register: local_path_class
      retries: 60
      delay: 5
      until: local_path_class.rc == 0
      changed_when: false

    # k3s는 재시작할 때마다 packaged manifest를 다시 적용해 기본값 표시를
    # 되살린다. .skip은 이미 만들어진 리소스는 그대로 두고 이후 적용만 막는다.
    # --disable은 리소스까지 지우므로 쓰지 않는다.
    #
    # 대가로 k3s를 업그레이드해도 local-path-provisioner는 갱신되지 않는다.
    - name: Keep k3s from re-applying the local-storage manifest
      ansible.builtin.copy:
        content: ""
        dest: "{{ local_storage_skip_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Read whether local-path is marked as the default
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - storageclass
          - local-path
          - -o
          - 'jsonpath={.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}'
      register: local_path_default
      changed_when: false

    - name: Remove the default marker from local-path
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - annotate
          - storageclass
          - local-path
          - "{{ default_class_annotation }}=false"
          - --overwrite
      when: local_path_default.stdout != 'false'
      changed_when: true
