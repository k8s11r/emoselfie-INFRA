---
# Traefik이 앞단에서 받은 X-Forwarded-Proto를 실제 연결 스킴으로 덮어쓰면
# backend의 same-origin 검사가 어긋나 /api/ POST가 FORBIDDEN_ORIGIN으로 막힌다
# (이슈 #11). 이 playbook은 그 설정을 클러스터에 남긴다.
#
# 단독 실행도 된다. Vault를 읽지 않으므로 --ask-vault-pass가 필요 없다.
#
#   ansible-playbook playbooks/traefik.yml

- name: Build a server-node inventory from Terraform outputs
  hosts: localhost
  gather_facts: false

  vars:
    repo_root: "{{ playbook_dir }}/../.."
    terraform_dir: "{{ repo_root }}/terraform"
    ssh_private_key_file: "{{ repo_root }}/../project1_key.pem"

  tasks:
    - name: Check the administrator SSH private key
      ansible.builtin.stat:
        path: "{{ ssh_private_key_file }}"
      register: administrator_ssh_key

    - name: Validate the administrator SSH private key
      ansible.builtin.assert:
        that:
          - administrator_ssh_key.stat.exists
          - administrator_ssh_key.stat.isreg
        fail_msg: >-
          Terraform 인스턴스에 접속할 project1_key.pem을 찾을 수 없습니다:
          {{ ssh_private_key_file }}

    - name: Read all node public IPs from Terraform
      ansible.builtin.command:
        argv:
          - terraform
          - "-chdir={{ terraform_dir }}"
          - output
          - -json
          - node_public_ips
      register: terraform_node_ips
      changed_when: false
      check_mode: false

    - name: Read the VPC CIDR from Terraform
      ansible.builtin.command:
        argv:
          - terraform
          - "-chdir={{ terraform_dir }}"
          - output
          - -raw
          - vpc_cidr
      register: terraform_vpc_cidr
      changed_when: false
      check_mode: false

    # manifests 디렉터리와 그것을 읽는 addon 컨트롤러는 server 노드에만 있다.
    # agent에 파일을 놓으면 아무 일도 일어나지 않는다.
    - name: Add the k3s server nodes to the in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.key }}"
        groups: k3s_servers
        ansible_host: "{{ item.value }}"
        ansible_user: ubuntu
        ansible_ssh_private_key_file: "{{ ssh_private_key_file }}"
        ansible_python_interpreter: /usr/bin/python3
        vpc_cidr: "{{ terraform_vpc_cidr.stdout | trim }}"
      loop: >-
        {{ (terraform_node_ips.stdout | from_json) | dict2items
           | selectattr('key', 'match', '^server') | list }}
      loop_control:
        label: "{{ item.key }}"

    - name: Validate that Terraform reported at least one server node
      ansible.builtin.assert:
        that: (groups['k3s_servers'] | default([])) | length > 0
        fail_msg: >-
          Terraform output의 node_public_ips에 server로 시작하는 노드가 없습니다.
          terraform apply가 끝났는지 확인하십시오.

- name: Trust forwarded headers at the Traefik entry point
  hosts: k3s_servers
  gather_facts: false
  become: true

  vars:
    # 앞단(ALB, 터널)이 VPC 안에서 요청을 보낸다는 전제다. 앞단을 바꾸면 이
    # 값을 실제 출발지 범위로 다시 맞춰야 한다. ansible/README.md 참고.
    traefik_trusted_ips:
      - "{{ vpc_cidr }}"

  pre_tasks:
    - name: Wait until the server node accepts SSH connections
      ansible.builtin.wait_for_connection:
        timeout: 300

  tasks:
    - name: Validate the trusted proxy ranges
      ansible.builtin.assert:
        that:
          - traefik_trusted_ips | length > 0
          - traefik_trusted_ips
            | reject('match', '^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$')
            | list | length == 0
        fail_msg: >-
          traefik_trusted_ips는 비어 있지 않은 IPv4 CIDR 목록이어야 합니다:
          {{ traefik_trusted_ips }}

    # notify를 달지 않는다. k3s가 디렉터리를 감시해 몇 초 안에 반영하므로
    # k3s를 재시작할 이유가 없다.
    - name: Place the Traefik HelmChartConfig in the k3s manifests directory
      ansible.builtin.template:
        src: ../templates/traefik-config.yaml.j2
        dest: /var/lib/rancher/k3s/server/manifests/traefik-config.yaml
        owner: root
        group: root
        mode: "0600"

    # 적용은 비동기다. Helm 컨트롤러가 upgrade Job을 돌린 뒤에야 Deployment가
    # 갱신되므로, 곧바로 rollout status를 부르면 옛 Deployment가 이미 안정
    # 상태라 성공을 반환한다. 스펙에 플래그가 나타날 때까지 기다린다.
    - name: Wait until the Traefik deployment carries the forwarded-header flag
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - kube-system
          - get
          - deployment
          - traefik
          - -o
          - "jsonpath={.spec.template.spec.containers[0].args}"
      register: traefik_arguments
      retries: 60
      delay: 5
      until: "'forwardedHeaders' in traefik_arguments.stdout"
      changed_when: false

    - name: Wait for the Traefik rollout to finish
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - --namespace
          - kube-system
          - rollout
          - status
          - deployment/traefik
          - --timeout=5m
      changed_when: false
