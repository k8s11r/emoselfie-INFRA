---
# 플레이북은 Git에서 아무것도 받지 않고 실행자의 로컬 작업 트리를 그대로 배포한다.
# 그래서 배포 전에 로컬 트리가 origin/main과 같은지 확인하고, 다르면 경고를
# 보여 준 뒤 계속할지 묻는다. traefik.yml의 localhost 플레이가 include_tasks로
# 가져오고, site.yml은 traefik.yml을 먼저 import하므로 둘 다 한 번씩 거친다.
# 비대화형(CI 등)에서는 -e skip_git_check=true로 건너뛴다.
#
# 필요 변수: repo_root

- name: Check that the local tree matches origin/main
  when: not (skip_git_check | default(false) | bool)
  block:
    - name: Fetch origin/main
      ansible.builtin.command:
        argv: [git, -C, "{{ repo_root }}", fetch, --quiet, origin, main]
      changed_when: false

    - name: Read uncommitted changes
      ansible.builtin.command:
        argv: [git, -C, "{{ repo_root }}", status, --porcelain]
      register: git_status
      changed_when: false

    - name: Read HEAD and origin/main
      ansible.builtin.command:
        argv: [git, -C, "{{ repo_root }}", rev-parse, HEAD, origin/main]
      register: git_revs
      changed_when: false

    - name: Decide whether the local tree matches origin/main
      ansible.builtin.set_fact:
        git_tree_dirty: "{{ git_status.stdout | trim | length > 0 }}"
        git_head_differs: "{{ git_revs.stdout_lines[0] != git_revs.stdout_lines[1] }}"

    - name: Ask whether to continue with a tree that is not origin/main
      ansible.builtin.pause:
        prompt: |-

          경고: 로컬 트리가 origin/main과 다릅니다. 이 상태가 그대로 배포됩니다.
            HEAD        {{ git_revs.stdout_lines[0][:7] }}
            origin/main {{ git_revs.stdout_lines[1][:7] }}
            미커밋 변경 {{ git_status.stdout_lines | length }}건{{ ':' if git_tree_dirty else '' }}
          {{ git_status.stdout | indent(4, true) }}
          그래도 계속할까요? (yes/no)
      register: git_check_answer
      when: git_tree_dirty or git_head_differs

    - name: Stop unless the answer was yes
      ansible.builtin.fail:
        msg: >-
          배포를 중단합니다. git pull로 origin/main을 맞추고 미커밋 변경 없이
          다시 실행하세요. 의도한 상태라면 yes를 입력하거나 -e skip_git_check=true로
          건너뜁니다.
      when:
        - git_check_answer is not skipped
        - (git_check_answer.user_input | default('') | trim | lower) != 'yes'
