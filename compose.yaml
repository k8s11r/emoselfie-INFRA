# 로컬 전체 실행 구성
#
#   docker compose up --build
#   → http://localhost:8080
#
# 세 저장소가 형제 디렉터리에 있는 배치를 전제한다.
#   emoselfie-INFRA/  ← 이 파일
#   emoselfie-BE/
#   emoselfie-FE/
#
# 백엔드는 linux/amd64 전용이다. MediaPipe가 linux/aarch64 휠을 배포하지
# 않기 때문이며, Apple Silicon에서는 Rosetta로 실행된다. 배포 대상인 EC2가
# amd64이므로 로컬과 운영이 같은 이미지를 쓴다.

name: emoselfie

services:
  # ──────────────────────────────── 데이터 ────────────────────────────────
  postgres:
    image: postgres:16.13-alpine
    environment:
      POSTGRES_USER: emoselfie
      POSTGRES_PASSWORD: local-development
      POSTGRES_DB: emoselfie
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emoselfie -d emoselfie"]
      interval: 2s
      timeout: 2s
      retries: 30

  # 조율용. 게임 진행 상태가 조용히 사라지면 안 되므로 noeviction (spec §5)
  redis:
    image: redis:7.4.8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # 이미지 캐시용. 유실돼도 사진만 안 보이고 점수는 무사하므로 lru (D-1)
  redis-media:
    image: redis:7.4.8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # ────────────────────────────── 모델 아티팩트 ──────────────────────────────
  # 백엔드보다 먼저 한 번 돌고 끝난다. K8s의 init container와 같은 역할이다.
  # 스크립트가 멱등하므로 파일이 이미 있고 sha256이 맞으면 받지 않고 검증만 한다.
  # 볼륨은 emoselfie-BE/.models를 그대로 쓴다. 네이티브 개발과 캐시를 공유해
  # 94MB를 두 번 받지 않는다.
  prepare-models:
    build:
      context: ../emoselfie-BE
      dockerfile: Dockerfile
      target: models
    image: emoselfie-models:local
    volumes:
      - ../emoselfie-BE/.models:/models
    command: ["--directory", "/models"]
    restart: "no"

  # ─────────────────────────────── 마이그레이션 ───────────────────────────────
  # 백엔드보다 먼저 한 번 돌고 끝난다. alembic은 Settings()를 통해
  # DATABASE_URL을 읽는다 (app/db/migrations/env.py:20).
  migrate:
    build:
      context: ../emoselfie-BE
      dockerfile: Dockerfile
    image: emoselfie-backend:local
    platform: linux/amd64
    command: ["alembic", "upgrade", "head"]
    environment: &backend-env
      APP_ENV: development
      INFERENCE_BACKEND: real
      DATABASE_URL: postgresql+asyncpg://emoselfie:local-development@postgres:5432/emoselfie
      REDIS_URL: redis://redis:6379/0
      REDIS_MEDIA_URL: redis://redis-media:6379/0
      # 로컬 전용 값이다. 운영에서는 Secret으로 주입한다 (spec §20).
      # 직접 만들려면: uv run python scripts/init_env.py
      COOKIE_SECRET: ${COOKIE_SECRET:-local-development-cookie-secret-do-not-use-in-production-0}
      CAPTURE_TOKEN_SECRET: ${CAPTURE_TOKEN_SECRET:-local-development-capture-secret-do-not-use-in-production}
      MEDIA_TOKEN_SECRET: ${MEDIA_TOKEN_SECRET:-local-development-media-secret-do-not-use-in-production-0}
      # 스크립트가 한 디렉터리에 평면으로 내려받으므로 spec §20의 기본 경로
      # (/models/emotion/v1/...) 대신 실제 위치를 지정한다. K8s도 같은 스크립트를
      # initContainer로 쓰므로 같은 평면 경로를 지정한다
      # (k8s/base/kustomization.yaml의 backend-env).
      EMOTION_MODEL_PATH: /models/FER_static_ResNet50_AffectNet.pt
      FACE_MODEL_PATH: /models/blaze_face_short_range.tflite
      INFERENCE_CONCURRENCY: "2"
      INFERENCE_TORCH_THREADS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ──────────────────────────────── 백엔드 ────────────────────────────────
  backend:
    build:
      context: ../emoselfie-BE
      dockerfile: Dockerfile
    image: emoselfie-backend:local
    platform: linux/amd64
    # 기본 Dockerfile CMD는 forwarded_allow_ips가 127.0.0.1이라 nginx(별도 컨테이너)의
    # X-Forwarded-Proto를 무시한다. nginx만 backend에 닿을 수 있으므로 로컬 compose
    # 한정으로 신뢰 범위를 넓힌다 (Dockerfile 자체는 프로덕션 이미지라 건드리지 않음).
    command: ["uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0",
              "--port", "8000", "--timeout-graceful-shutdown", "10",
              "--proxy-headers", "--forwarded-allow-ips=*"]
    environment: *backend-env
    volumes:
      # 모델 가중치는 이미지에 넣지 않는다. prepare-models가 채워 넣은 것을
      # 읽기 전용으로 본다 (가이드라인 §19·20). 파일이 없거나 체크섬이 어긋나면
      # 백엔드가 startup에서 실패한다.
      - ../emoselfie-BE/.models:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-media:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      prepare-models:
        condition: service_completed_successfully
    healthcheck:
      # 모델 로드와 warmup이 끝나야 통과한다 (spec §8.5)
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s
    stop_grace_period: 20s

  # ───────────────────────── 리버스 프록시 + 정적 자산 ─────────────────────────
  web:
    build:
      context: ../emoselfie-FE
      dockerfile: Dockerfile
    image: emoselfie-web:local
    ports: ["127.0.0.1:8080:80"]
    volumes:
      # Compose는 nginx 프록시를 유지한다. K8s 정적 서버 설정과 분리한다.
      - ./compose/web/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
