# k3d 전용 공유 볼륨.
#
# k3d는 노드가 전부 같은 Docker 호스트의 컨테이너다. 호스트 디렉터리 하나를
# 세 노드에 모두 물리면 그게 곧 공유 스토리지가 된다. 별도 컴포넌트가 없다.
#
# 클러스터 생성 시 --volume 이 필요하다 (README 참고).
#   k3d cluster create mycluster --servers 3 \
#     --volume "$HOME/.emoselfie-models:/models@all" \
#     -p "80:80@loadbalancer" -p "443:443@loadbalancer"
#
# 운영은 Longhorn이 같은 ReadWriteMany를 복제 볼륨으로 제공한다. 접근 모드
# 의미가 같으므로 "여러 노드의 pod가 모델 하나를 공유한다"는 경로는 로컬에서도
# 그대로 검증된다.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: models-k3d-hostpath
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  # 빈 문자열이라 동적 프로비저닝을 타지 않고 아래 PVC와 정적으로 묶인다.
  storageClassName: ""
  hostPath:
    path: /models
