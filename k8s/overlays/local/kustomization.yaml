apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: local

resources:
  - ../../base

# 로컬은 arm64 네이티브다. mediapipe 1.0.1과 torch 2.8.0 모두 manylinux_2_28_aarch64
# 휠이 있고 pyproject.toml이 이미 플랫폼별로 분기하므로, 추론을 그대로 쓴다.
# 에뮬레이션 없이 네이티브로 돈다.
#
#   docker build -t emoselfie-backend:local ../emoselfie-BE
#   docker build --target models -t emoselfie-models:local ../emoselfie-BE
#   docker build -t emoselfie-web:local ../emoselfie-FE
#   k3d image import emoselfie-backend:local emoselfie-models:local emoselfie-web:local -c mycluster
images:
  - name: emoselfie-backend
    newTag: local
  - name: emoselfie-models
    newTag: local
  - name: emoselfie-web
    newTag: local

# backend의 replica 수는 base의 HPA(1~3개, cpu 70%)가 관리한다. 노드를
# --servers-memory 4g로 t3.medium과 같게 맞춘 건 그대로다: 부하가 몰려 3개까지
# 늘어나도 3노드에 스케줄되는지 그때 확인된다.

configMapGenerator:
  - name: backend-env
    behavior: merge
    literals:
      - APP_ENV=development
      - ALLOW_INSECURE_COOKIE=true
      - INFERENCE_BACKEND=real
      # 기본 60초. loadtest/(업로드 직격 부하 테스트)가 만드는 참가자는 Socket.IO에
      # 붙지 않아 grace 내내 "접속 안 한 참가자"로 보이고, 60초가 지나면
      # app/domain/round/runner.py가 status=left로 치워 방을 finished로 닫아버린다.
      # 그러면 이후 제출이 전부 403 NOT_A_PARTICIPANT가 된다(loadtest/README.md).
      # 값을 크게 잡아 로컬 테스트 동안은 이 정리가 사실상 발동하지 않게 한다.
      # prod overlay에도 같은 값이 있다 — 부하 테스트 창구에서만 켜고, 끝나면
      # 지워서 60초로 되돌릴 것 (실제 플레이의 이탈 판정이 늦어지면 안 되므로).
      - PARTICIPANT_GRACE_SEC=86400

# 로컬 전용 값이다. 운영에서는 클러스터에 직접 만든 Secret을 쓴다.
# compose.yaml의 기본값과 동일하다.
secretGenerator:
  - name: emoselfie-secrets
    literals:
      - POSTGRES_USER=emoselfie
      - POSTGRES_PASSWORD=local-development
      - POSTGRES_DB=emoselfie
      - DATABASE_URL=postgresql+asyncpg://emoselfie:local-development@postgres:5432/emoselfie
      - COOKIE_SECRET=local-development-cookie-secret-do-not-use-in-production-0
      - CAPTURE_TOKEN_SECRET=local-development-capture-secret-do-not-use-in-production
      - MEDIA_TOKEN_SECRET=local-development-media-secret-do-not-use-in-production-0

patches:
  # 로컬은 HTTP라 라우팅 쿠키의 Secure를 내린다. ALLOW_INSECURE_COOKIE=true와 짝이다.
  - target: {kind: Service, name: backend}
    patch: |
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1service.sticky.cookie.secure
        value: "false"
