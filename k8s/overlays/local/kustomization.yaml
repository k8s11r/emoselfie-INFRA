apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: local

resources:
  - ../../base

# 로컬은 arm64 네이티브다. MediaPipe가 aarch64 휠을 배포하지 않아 추론 의존성을
# 뺀 이미지를 쓰고, INFERENCE_BACKEND=fake로 load_real_pipeline을 우회한다
# (app/inference/loader.py:70). 모델 가중치도 필요 없다.
#
#   docker build --build-arg UV_EXTRAS= -t emoselfie-backend:arm64-dev ../emoselfie-BE
#   k3d image import emoselfie-backend:arm64-dev emoselfie-web:local -c mycluster
images:
  - name: emoselfie-backend
    newTag: arm64-dev
  - name: emoselfie-web
    newTag: local

configMapGenerator:
  - name: backend-env
    behavior: merge
    literals:
      - APP_ENV=development
      - INFERENCE_BACKEND=fake

# 로컬 전용 값이다. 운영에서는 클러스터에 직접 만든 Secret을 쓴다.
# compose.yaml의 기본값과 동일하다.
secretGenerator:
  - name: emoselfie-secrets
    literals:
      - POSTGRES_USER=emoselfie
      - POSTGRES_PASSWORD=local-development
      - POSTGRES_DB=emoselfie
      - DATABASE_URL=postgresql+asyncpg://emoselfie:local-development@postgres:5432/emoselfie
      - COOKIE_SECRET=local-development-cookie-secret-do-not-use-in-production-0
      - CAPTURE_TOKEN_SECRET=local-development-capture-secret-do-not-use-in-production
      - MEDIA_TOKEN_SECRET=local-development-media-secret-do-not-use-in-production-0
