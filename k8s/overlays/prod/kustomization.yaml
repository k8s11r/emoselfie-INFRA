apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: emoselfie

resources:
  - ../../base

# EC2는 amd64 이미지를 사용한다. 아래 태그는 수동 kubectl 배포용 기본값이고,
# Ansible 배포에서는 실제 ECR 저장소와 sha 태그로 다시 덮는다. models 이미지는
# 가중치를 포함하는 이미지가 아니라 Longhorn 볼륨으로 다운로드하는 init
# container다.
images:
  - name: emoselfie-backend
    newTag: amd64-v1
  - name: emoselfie-models
    newTag: amd64-v1
  - name: emoselfie-web
    newTag: v1

replicas:
  - name: backend
    count: 2

configMapGenerator:
  - name: backend-env
    behavior: merge
    literals:
      - APP_ENV=production
      - ALLOW_INSECURE_COOKIE=false
      - INFERENCE_BACKEND=real

# Secret은 저장소에 두지 않는다. 배포 전에 클러스터에 직접 만든다.
#   kubectl create secret generic emoselfie-secrets -n emoselfie \
#     --from-literal=POSTGRES_USER=... --from-literal=DATABASE_URL=... ...

patches:
  # 모델 가중치를 3노드가 공유한다. 최초 1회만 받고 이후 pod는 재사용한다.
  # Longhorn 설치가 선행돼야 한다 (README 참고).
  - target: {kind: PersistentVolumeClaim, name: models}
    patch: |
      - op: add
        path: /spec/storageClassName
        value: longhorn

  # 운영의 라우팅 쿠키도 HTTPS에서만 전송한다.
  - target: {kind: Service, name: backend}
    patch: |
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1service.sticky.cookie.secure
        value: "true"
