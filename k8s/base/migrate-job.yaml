# 백엔드보다 먼저 한 번 돌고 끝난다. alembic은 Settings()를 통해 DATABASE_URL을
# 읽는다 (app/db/migrations/env.py:20).
#
# backend의 initContainer로 넣지 않는 이유: initContainer는 replica마다 실행돼
# 여러 개가 동시에 alembic을 돌린다.
#
# Job은 완료 후 spec이 immutable이라 재배포 전에 지워야 한다.
#   kubectl delete job migrate --ignore-not-found
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      # postgres보다 먼저 뜨면 DNS 조회부터 실패한다. Job은 backoffLimit을
      # 소진하면 영구 실패라 재시도에 기대면 안 된다. 실제로 로컬 배포에서
      # 두 번 실패하고 세 번째에 겨우 성공했다. EC2는 디스크가 느려 더 위험하다.
      initContainers:
        - name: wait-postgres
          image: postgres:16.13-alpine
          command:
            - sh
            - -c
            - 'until pg_isready -h postgres -p 5432; do echo "postgres 대기 중"; sleep 2; done'
      containers:
        - name: migrate
          image: emoselfie-backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: {name: backend-env}
            - secretRef: {name: emoselfie-secrets}
