# 모델 가중치 94MB를 노드 전체가 공유한다.
#
# emptyDir은 pod마다 따로라 pod가 새로 뜰 때마다 다시 받았다. 공유 볼륨을 쓰면
# 최초 1회만 받고 이후 pod들은 그대로 재사용한다. 3노드지만 실물은 하나다.
#
# prepare_models.py가 이 방식을 이미 지원한다. 파일이 있고 sha256이 맞으면
# 받지 않고, 받을 때는 임시 파일에 쓴 뒤 os.replace로 원자 교체하므로 여러 pod가
# 동시에 초기화해도 안전하다.
#
# ReadWriteMany는 여러 노드의 pod가 같은 볼륨을 동시에 붙일 수 있다는 뜻이다.
# 여기서 storageClassName을 비워두는 것은 의도적이다. 어떤 스토리지로 이걸
# 만족시킬지는 환경마다 다르므로 오버레이가 채운다.
#   prod  -> longhorn. 동적 프로비저닝, 노드 간 복제 볼륨
#   local -> "" + volumeName. k3d 노드가 같은 Docker 호스트의 컨테이너라
#            호스트 디렉터리 하나를 세 노드에 물려 쓴다
#            (k8s/overlays/local/models-pv.yaml)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
