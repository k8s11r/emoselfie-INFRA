# 이미지 캐시다. 유실돼도 사진만 안 보이고 점수는 무사하므로(D-1) 복제도
# 영속화도 하지 않는다. Sentinel을 붙이지 않는 이유이기도 하다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-media
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-media
  template:
    metadata:
      labels:
        app: redis-media
    spec:
      containers:
        - name: redis
          image: redis:7.4.8-alpine
          command: ["redis-server", "--save", "", "--appendonly", "no",
                    "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5

---

apiVersion: v1
kind: Service
metadata:
  name: redis-media
spec:
  selector:
    app: redis-media
  ports:
    - port: 6379
      targetPort: 6379
