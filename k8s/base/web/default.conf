# API, 미디어, Socket.IO는 Traefik Ingress가 backend로 직접 보낸다.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pod readiness는 backend 상태와 독립적으로 검사한다.
    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
