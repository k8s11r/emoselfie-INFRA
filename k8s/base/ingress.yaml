# k3d와 k3s 모두 Traefik을 기본 탑재한다. 로컬은 k3d serverlb가 호스트 80을
# 잡고 있어 http://localhost 로 바로 닿는다.
#
# FE는 WebSocket 우선이다. polling 사용 시에도 같은 Pod로 가도록
# backend Service의 Traefik sticky cookie 설정을 함께 적용한다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emoselfie
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /openapi.json
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /media
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
