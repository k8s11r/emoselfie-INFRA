# 단일 인스턴스다. HA가 아니다.
#
# k3s 기본 스토리지가 local-path라 PVC가 특정 노드 디스크에 묶인다. 그 노드가
# 죽으면 pod가 다른 노드로 재스케줄되지 못하고 Pending에 갇힌다. 즉 3노드
# 구성에서 여기만 단일 장애점으로 남는다.
#
# 진짜 HA가 필요해지면 CloudNativePG 오퍼레이터로 교체한다. 공유 스토리지 없이
# 스트리밍 복제 + 자동 failover를 하므로 local-path 위에서도 동작한다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16.13-alpine
          env:
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: emoselfie-secrets, key: POSTGRES_USER}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: emoselfie-secrets, key: POSTGRES_PASSWORD}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: emoselfie-secrets, key: POSTGRES_DB}}
            # 기본 데이터 디렉터리에 바로 마운트하면 lost+found 때문에 initdb가
            # 실패하는 환경이 있다. 하위 디렉터리를 쓴다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
