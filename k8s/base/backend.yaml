apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # 노드 하나가 죽어도 서비스가 유지되게 replica를 흩뿌린다.
      # 노드가 부족하면 스케줄을 막지 않도록 preferred로 둔다.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: backend
      containers:
        - name: backend
          image: emoselfie-backend
          envFrom:
            - configMapRef: {name: backend-env}
            - secretRef: {name: emoselfie-secrets}
          ports:
            - containerPort: 8000
          # 모델 로드와 warmup이 끝나야 통과한다 (spec §8.5). compose의
          # start_period 60s에 대응한다. liveness를 initialDelaySeconds로
          # 미루면 로드가 느린 날 무한 재시작 루프에 빠지므로 startupProbe를 쓴다.
          startupProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
      # Socket.IO 연결이 살아 있으면 uvicorn의 graceful shutdown이 끝나지 않는다.
      # 이미지 CMD의 --timeout-graceful-shutdown 10 보다 넉넉하게 준다.
      terminationGracePeriodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
