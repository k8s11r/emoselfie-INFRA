apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  # replicas를 여기서 명시하지 않는다 — 아래 HPA(minReplicas 1)가 관리한다.
  # kustomize가 빌드 시 채워 넣는 기본값(1)도 마침 minReplicas와 같아서
  # apply할 때마다 그 값으로 되돌아가는 flapping이 없다.
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # 노드 하나가 죽어도 서비스가 유지되게 replica를 흩뿌린다.
      # podAntiAffinity(preferred)는 "선호"일 뿐 분배를 보장 못 해 이걸로 바꿨다.
      #
      # DoNotSchedule로 강제한다: ScheduleAnyway(소프트)일 때 노드 3개가 멀쩡한데도
      # 2:1:0처럼 치우친 배치가 실제로 관측됐다(HPA 부하 테스트 중). DoNotSchedule은
      # 그런 배치를 거부해 노드가 다 살아있으면 1:1:1로 강제한다.
      #
      # 노드가 죽었을 때 Pending에 갇히는 걸 걱정할 필요는 없다 — k8s가 NotReady
      # 노드에 자동으로 taint를 붙이고, nodeTaintsPolicy 기본값(Honor, 1.26+)이
      # taint 붙은 노드를 skew 계산 대상에서 아예 뺀다. 그래서 노드 하나가 죽으면
      # 남은 노드들만 놓고 균형을 맞추므로(예: 2노드 남았으면 skew 1까지 2:1 허용),
      # DoNotSchedule이어도 장애 시 스케줄이 막히지 않는다.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend
      # 모델 가중치 94MB는 이미지에 없다. BE Dockerfile의 models 스테이지가
      # 이 용도로 만들어져 있다(ENTRYPOINT prepare_models.py, CMD --directory
      # /models). 운영 이미지에 다운로드 클라이언트를 넣지 않기 위한 분리다
      # (BE 가이드라인 §28). 스크립트는 멱등하고 sha256을 검증한다.
      #
      # [임시, docs/longhorn-removal-interim-hostpath.md] hostPath라 노드마다
      # 독립적으로 받는다. 같은 노드에 재스케줄되면 스크립트가 sha256으로
      # 확인하고 건너뛰지만, 다른 노드로 가면 그 노드에서 1회 다시 받는다.
      # 최종 방향은 이미지 내장(docs/longhorn-removal-plan.md)이다.
      initContainers:
        # dependency_checks()가 postgres/redis 연결에 실패하면 RuntimeError를
        # 던져 uvicorn 프로세스 자체가 죽는다(app/core/resources.py:81) — 콜드
        # 부트 시 CrashLoopBackOff에 의존하게 되는데, 백오프가 지수적으로
        # 늘어나 dependency가 실제로 뜬 뒤에도 재시작까지 불필요하게 오래
        # 걸린다. migrate Job의 wait-postgres와 같은 방식(고정 간격 폴링)으로
        # 네트워크 레벨 대기를 넣어 이 문제를 없앤다. postgres/redis-sentinel은
        # headless(clusterIP: None), redis-media는 일반 ClusterIP지만 둘 다
        # Ready pod만 Endpoints에 올라가므로 nc로 충분히 게이팅된다. k3d 3노드
        # 콜드부트 실측: 대기 없이는 backend가 Init:Error로 재시작을 반복했으나,
        # 이 initContainer를 넣은 뒤로는 재시작 0회로 정상 기동됨.
        - name: wait-dependencies
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo "postgres 대기 중"; sleep 2; done
              until nc -z redis-sentinel 26379; do echo "redis-sentinel 대기 중"; sleep 2; done
              until nc -z redis-media 6379; do echo "redis-media 대기 중"; sleep 2; done
        - name: prepare-models
          image: emoselfie-models
          # NamedTemporaryFile의 기본 권한은 0600이다. initContainer(root)가
          # 만든 모델을 runtime의 appuser(UID 10001)가 읽을 수 있도록, 검증이
          # 끝난 비밀 데이터가 아닌 모델 파일만 0644로 바꾼다. 기존 PVC에 이미
          # root:root 0600 파일이 남아 있어도 root가 먼저 검증하므로 복구된다.
          command:
            - sh
            - -ec
            - |
              python scripts/prepare_models.py --directory /models
              chmod 0644 \
                /models/FER_static_ResNet50_AffectNet.pt \
                /models/blaze_face_short_range.tflite
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: backend
          image: emoselfie-backend
          # Traefik이 전달한 외부 scheme으로 Origin과 쿠키 정책을 판단한다.
          # 기존 신뢰 설정을 유지한다. ClusterIP는 접근 제어가 아니므로
          # 운영에서는 신뢰한 프록시만 Pod에 접근할 수 있도록 제한해야 한다.
          command: ["uvicorn", "app.main:create_app", "--factory",
                    "--host", "0.0.0.0", "--port", "8000",
                    "--timeout-graceful-shutdown", "10",
                    "--proxy-headers", "--forwarded-allow-ips=*"]
          envFrom:
            - configMapRef: {name: backend-env}
            - secretRef: {name: emoselfie-secrets}
          ports:
            - containerPort: 8000
          # requests == limits 로 Guaranteed QoS를 받는다. 추론 워크로드는
          # 노드 메모리 압박 시 축출되면 안 된다.
          #
          # torch가 limit을 모르고 코어 수만큼 스레드를 띄우면 스로틀링으로
          # 오히려 느려지므로 INFERENCE_TORCH_THREADS=1 과 cpu limit을 맞춘다.
          #
          # 로컬 k3d도 --servers-memory 4g 로 노드를 t3.medium과 같게 맞춰서
          # 이 값으로 스케줄이 되는지 미리 확인한다.
          resources:
            requests: {cpu: "1", memory: 2Gi}
            limits:   {cpu: "1", memory: 2Gi}
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          # 모델 로드와 warmup이 끝나야 통과한다 (spec §8.5). compose의
          # start_period 60s에 대응한다. liveness를 initialDelaySeconds로
          # 미루면 로드가 느린 날 무한 재시작 루프에 빠지므로 startupProbe를 쓴다.
          startupProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
      # Socket.IO 연결이 살아 있으면 uvicorn의 graceful shutdown이 끝나지 않는다.
      # 이미지 CMD의 --timeout-graceful-shutdown 10 보다 넉넉하게 준다.
      terminationGracePeriodSeconds: 20
      volumes:
        - name: models
          hostPath:
            path: /models
            type: DirectoryOrCreate

---

apiVersion: v1
kind: Service
metadata:
  name: backend
  annotations:
    traefik.ingress.kubernetes.io/service.nativelb: "false"
    traefik.ingress.kubernetes.io/service.passhostheader: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: es_route
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: lax
    # 안전한 값을 기본으로 둔다. HTTP 로컬만 overlays/local에서 false로 낮춘다.
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
spec:
  # Traefik이 Pod로 직접 분산하므로 ClientIP 대신 위 라우팅 쿠키를 사용한다.
  sessionAffinity: None
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000

---

# cpu request(위, "1")의 70% 기준. 부하 테스트(loadtest/)에서 한 pod가
# request/limit의 99%까지 찍힌 걸 실측해서 고른 값이다. 실습용이라 local/prod
# 구분 없이 minReplicas 1로 통일한다 — 평소 1개로 두다가 부하가 몰리면 어차피
# 스케일업되므로 당장 바닥을 올려둘 이유가 없다. 노드 3대(EC2: server 1 +
# agent 2, 로컬 k3d도 동일하게 3대) 기준으로 maxReplicas 3.
#
# 새 pod가 Ready 되는 데는 모델 로드+warmup 때문에 startupProbe 여유(최대
# 120초)가 걸린다. 스케일업이 트래픽에 반영되기까지 그만큼 지연이 정상이다.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
