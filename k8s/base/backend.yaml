apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # 노드 하나가 죽어도 서비스가 유지되게 replica를 흩뿌린다.
      # 노드가 부족하면 스케줄을 막지 않도록 preferred로 둔다.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: backend
      # 모델 가중치 94MB는 이미지에 없다. BE Dockerfile의 models 스테이지가
      # 이 용도로 만들어져 있다(ENTRYPOINT prepare_models.py, CMD --directory
      # /models). 운영 이미지에 다운로드 클라이언트를 넣지 않기 위한 분리다
      # (BE 가이드라인 §28). 스크립트는 멱등하고 sha256을 검증한다.
      #
      # emptyDir이라 pod가 새로 뜰 때마다 다시 받는다. 노드마다 파일을 수동으로
      # 뿌리지 않아도 되는 대신 기동이 느려지는 교환이다.
      initContainers:
        - name: prepare-models
          image: emoselfie-models
          volumeMounts:
            - name: models
              mountPath: /models
      containers:
        - name: backend
          image: emoselfie-backend
          envFrom:
            - configMapRef: {name: backend-env}
            - secretRef: {name: emoselfie-secrets}
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
          # 모델 로드와 warmup이 끝나야 통과한다 (spec §8.5). compose의
          # start_period 60s에 대응한다. liveness를 initialDelaySeconds로
          # 미루면 로드가 느린 날 무한 재시작 루프에 빠지므로 startupProbe를 쓴다.
          startupProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: {path: /health/ready, port: 8000}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: 8000}
            periodSeconds: 10
      # Socket.IO 연결이 살아 있으면 uvicorn의 graceful shutdown이 끝나지 않는다.
      # 이미지 CMD의 --timeout-graceful-shutdown 10 보다 넉넉하게 준다.
      terminationGracePeriodSeconds: 20
      volumes:
        - name: models
          emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
