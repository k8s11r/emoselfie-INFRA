apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-sentinel-config
data:
  sentinel.conf: |
    port 26379
    # 기본값(no)이면 monitor에 IP만 허용되어 hostname은 FATAL로 거부된다
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    # 최초 부트스트랩 시점의 master. 이후 failover 결과는 sentinel이 이 파일을 rewrite해 /data에 보존한다.
    sentinel monitor mymaster redis-0.redis.local.svc.cluster.local 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 10000
    sentinel parallel-syncs mymaster 1

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
spec:
  serviceName: redis-sentinel
  replicas: 3
  selector:
    matchLabels:
      app: redis-sentinel
  template:
    metadata:
      labels:
        app: redis-sentinel
    spec:
      containers:
        - name: sentinel
          image: redis:7
          # ConfigMap은 read-only인데 sentinel은 config를 rewrite해야 한다.
          # 최초 1회만 seed하고, 이후에는 PVC에 남은 (failover 반영된) config를 그대로 쓴다.
          command:
            - sh
            - -c
            - '[ -f /data/sentinel.conf ] || cp /etc/redis/sentinel.conf /data/sentinel.conf; exec redis-server /data/sentinel.conf --sentinel'
          ports:
            - containerPort: 26379
          readinessProbe:
            exec:
              command: ["redis-cli", "-p", "26379", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/redis
            - name: sentinel-data
              mountPath: /data
      volumes:
        - name: config
          configMap:
            name: redis-sentinel-config
  volumeClaimTemplates:
    - metadata:
        name: sentinel-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 100Mi
        storageClassName: local-path

---

apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel
spec:
  clusterIP: None
  selector:
    app: redis-sentinel
  ports:
    - port: 26379
      targetPort: 26379
