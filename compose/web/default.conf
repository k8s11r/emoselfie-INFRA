# Compose 전용 동일 오리진 리버스 프록시 (spec D-3, §2.1)
# K8s는 Ingress가 분기하며 k8s/base/web/default.conf는 정적 서버 전용이다.
#
# 브라우저는 이 서버 하나만 본다. 경로를 보고 백엔드와 정적 자산으로 가른다.
# emoselfie-FE/vite.config.ts의 dev 프록시가 하던 일을 그대로 옮긴 것이다.

# WebSocket 업그레이드용. map은 http 컨텍스트에 있어야 하며 conf.d는 그 안이다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# nginx는 TLS 리스너가 없어 $scheme이 항상 http다. Cloudflare Tunnel처럼
# 앞단에서 TLS를 종료하는 프록시가 이미 X-Forwarded-Proto를 보냈다면 그 값을
# 보존하고, 없을 때만(직접 로컬 접속) $scheme으로 폴백한다.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
    # Traefik(k3s 기본 Ingress)은 websocket 업그레이드에 http/https가 아니라
    # ws/wss를 넣는다. 그대로 넘기면 두 가지가 깨진다.
    #   · engineio가 X-Forwarded-Proto를 그대로 스킴으로 써서 허용 오리진을
    #     ws://host로 계산한다. 브라우저는 Origin: http://host를 보내므로
    #     websocket 연결이 403으로 거부된다
    #     (engineio/async_drivers/asgi.py:217)
    #   · 아래 $cookie_secure_flag가 https만 보므로 wss로 온 요청은 Secure를
    #     벗겨낸다. 실제로는 TLS인데 평문 취급이 된다
    ws      http;
    wss     https;
}

# 브라우저가 https(직접 또는 tunnel)로 왔을 때는 Secure를 유지하고,
# 진짜 http(로컬 직접 접속)로 왔을 때만 벗겨낸다.
map $forwarded_proto $cookie_secure_flag {
    default nosecure;
    https   secure;
}

upstream backend {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # PRD CP-04의 업로드는 MAX_UPLOAD_BYTES=2MB다. nginx 기본 상한이 1MB라
    # 그대로 두면 제출이 nginx에서 413으로 잘린다. 백엔드가 자기 한도로
    # PAYLOAD_TOO_LARGE를 돌려줄 수 있도록 여유를 두고 4m로 연다.
    client_max_body_size 4m;

    # ─────────────────────────── 백엔드로 보내는 경로 ───────────────────────────

    # 실시간 이벤트 (spec §13)
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;

        # 백엔드가 변경 요청에 same-origin 검사를 하므로 Host를 바꾸지 않는다.
        # vite.config.ts의 changeOrigin:false와 같은 이유다.
        # $host가 아니라 $http_host를 써야 한다. $host는 포트를 떼어내는데
        # 백엔드는 Origin의 netloc(localhost:8080)과 Host를 그대로 비교한다
        # (app/api/middleware.py:29). 포트가 빠지면 FORBIDDEN_ORIGIN이 난다.
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;

        proxy_buffering    off;
        proxy_read_timeout 1h;

        # Safari는 http 오리진에 Secure 쿠키를 저장하지 않는다. localhost도
        # 마찬가지라 세션이 생기지 않는다. 백엔드는 secure=True로 고정 발급하므로
        # (app/api/middleware.py:62) 브라우저가 진짜 http로 왔을 때만 벗겨내고,
        # https(직접 또는 Cloudflare Tunnel)로 왔으면 그대로 둔다.
        proxy_cookie_flags ~ $cookie_secure_flag;
    }

    # REST API (spec §8)
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $forwarded_proto;

        # spec CP-08은 제출 시각을 "서버가 요청을 받기 시작한 시각"으로 정의한다.
        # nginx가 본문을 다 받은 뒤 넘기면 그 시각이 업로드 소요시간만큼 밀려
        # 마감 판정이 틀어진다. 버퍼링을 꺼서 헤더 도착 즉시 백엔드가 받게 한다.
        proxy_request_buffering off;

        proxy_cookie_flags ~ $cookie_secure_flag;
    }

    # 결과 화면 이미지 (spec §8.4, D-1)
    location /media/ {
        proxy_pass       http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # PV-04. 브라우저·중간 캐시 어디에도 남기지 않는다.
        proxy_cookie_flags ~ $cookie_secure_flag;
    }

    # 컨테이너 밖에서 백엔드 상태를 볼 수 있게 열어둔다 (spec §8.5)
    location /health/ {
        proxy_pass       http://backend;
        proxy_set_header Host $http_host;
        access_log       off;
    }

    # ────────────────────────────── 정적 자산 ──────────────────────────────

    root  /usr/share/nginx/html;
    index index.html;

    # 해시가 붙은 번들은 오래 캐시해도 안전하다
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA. 알 수 없는 경로는 index.html로 넘겨 클라이언트 라우터가 처리한다.
    # 초대 링크 /r/{slug} 가 이 경로로 들어온다 (RO-01).
    location / {
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
